name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Race detection is part of the contract: the fake provider is driven
      # concurrently by duplicate and reordered delivery scenarios, and a data
      # race there would make those results meaningless.
      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Test coverage
        run: go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      # Infrastructure that is never validated is how broken HCL ships and fails during a
      # deploy, which is the worst possible time to discover it.
      - name: Format
        run: terraform -chdir=infrastructure/foundation fmt -check -diff

      - name: Validate
        run: terraform -chdir=infrastructure/foundation init -backend=false -input=false && terraform -chdir=infrastructure/foundation validate
          if-no-files-found: ignore

  docs:
    name: document integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every checklist item must have exactly one indexed issue, and every
      # issue must map back to a checklist item. Drift here silently loses work.
      #
      # Both pending and completed boxes count: ticking a box records completion
      # and must not make an item vanish from the index.
      #
      # Phase gates are written as "G0 gate:" in the checklist and "G0-GATE" in
      # the index, so the suffix is normalised per line before comparing.
      - name: Verify checklist and issue index agree
        run: |
          set -euo pipefail
          checklist_ids=$(grep -oE '^- \[[ x]\] G[0-9Q]+(\.[0-9]+)?' docs/CHECKLIST.md \
            | sed -E 's/^- \[[ x]\] //' | sort)
          index_ids=$(grep -oE '^\| `G[0-9Q]+(\.[0-9]+)?(-GATE)?`' docs/ISSUE-TRACKING.md \
            | sed -E 's/^\| `//; s/`$//; s/-GATE$//' | sort)
          echo "checklist items: $(echo "$checklist_ids" | wc -l)"
          echo "index rows:      $(echo "$index_ids" | wc -l)"
          if [ "$checklist_ids" != "$index_ids" ]; then
            echo "Checklist and issue index have drifted."
            diff <(echo "$checklist_ids") <(echo "$index_ids") || true
            exit 1
          fi
          echo "checklist and index agree"

      # A state marker must be one of the declared values. An invented marker
      # would silently read as "not done" to every reader and every dashboard.
      - name: Verify state markers are declared
        run: |
          set -euo pipefail
          bad=$(grep -oE '\*\*\[[A-Z]+\]\*\*' docs/CHECKLIST.md \
            | sort -u | grep -vE '\*\*\[(WIP|DONE)\]\*\*' || true)
          if [ -n "$bad" ]; then
            echo "Undeclared state marker(s) in CHECKLIST.md:"
            echo "$bad"
            echo "Declare the marker in the checklist preamble first."
            exit 1
          fi
          echo "state markers declared: $(grep -oE '\*\*\[[A-Z]+\]\*\*' docs/CHECKLIST.md | sort -u | tr '\n' ' ')"

      # A duplicated table row or paragraph in the specification set is a
      # generation artefact, not an intentional restatement.
      - name: Detect duplicated ADR rows
        run: |
          set -euo pipefail
          dupes=$(grep -oE '^\| G-0[0-9]{2}' docs/DECISIONS.md | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "Duplicated ADR rows in DECISIONS.md:"
            echo "$dupes"
            exit 1
          fi